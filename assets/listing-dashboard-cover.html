<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数据分析与可视化看板服务主图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; background: #13211c; }
    .cover { position: relative; width: 1024px; height: 1024px; overflow: hidden; color: #fff; background: #13211c; }
    .cover::before {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 56px 56px;
      content: "";
    }
    .cover::after { position: absolute; top: 0; right: 0; width: 360px; height: 100%; background: #1a2c25; content: ""; }
    .dashboard {
      position: absolute;
      z-index: 1;
      top: 190px;
      right: 38px;
      width: 346px;
      height: 420px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, .38);
      background: #edf7fa;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      transform: rotate(2deg);
    }
    .dash-head { display: flex; align-items: center; justify-content: space-between; }
    .dash-title { width: 134px; height: 19px; background: #13211c; }
    .dash-filter { width: 84px; height: 25px; border: 1px solid #9fb2aa; background: #fff; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px; }
    .metric { height: 72px; padding: 13px 10px; border: 1px solid #d1dcda; background: #fff; }
    .metric::before { display: block; width: 42px; height: 9px; background: #9fb2aa; content: ""; }
    .metric::after { display: block; width: 55px; height: 19px; margin-top: 12px; background: #13211c; content: ""; }
    .metric:first-child { border-top: 7px solid #c4ef50; }
    .metric:nth-child(2) { border-top: 7px solid #f37a68; }
    .metric:last-child { border-top: 7px solid #13211c; }
    .chart { position: relative; height: 184px; margin-top: 20px; border: 1px solid #d1dcda; background: #fff; }
    .chart::before {
      position: absolute;
      left: 28px;
      right: 20px;
      bottom: 28px;
      height: 110px;
      background: linear-gradient(135deg, transparent 0 18%, #f37a68 18% 21%, transparent 21% 38%, #f37a68 38% 41%, transparent 41% 60%, #f37a68 60% 63%, transparent 63% 77%, #f37a68 77% 80%, transparent 80%);
      content: "";
    }
    .chart::after {
      position: absolute;
      left: 28px;
      right: 20px;
      bottom: 26px;
      height: 1px;
      background: #9fb2aa;
      box-shadow: 0 -42px 0 #dbe6e1, 0 -84px 0 #dbe6e1;
      content: "";
    }
    .dashboard-label {
      position: absolute;
      z-index: 2;
      right: 22px;
      bottom: 18px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: #13211c;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    .dashboard-label strong { color: #c4ef50; }
    .inner { position: relative; z-index: 2; display: flex; height: 100%; flex-direction: column; padding: 72px; }
    .brand { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: 700; }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 50%; background: #c4ef50; color: #13211c; font-size: 26px; font-weight: 900; }
    .label { width: max-content; margin-top: 92px; padding: 10px 16px; background: #edf7fa; color: #13211c; font-size: 21px; font-weight: 800; }
    h1 { max-width: 620px; margin: 28px 0 20px; font-size: 64px; line-height: 1.09; letter-spacing: 0; }
    .subtitle { max-width: 610px; margin: 0; color: #dbe6e1; font-size: 26px; font-weight: 600; }
    .features { display: flex; max-width: 640px; flex-wrap: wrap; gap: 12px; margin-top: 48px; }
    .features span { padding: 12px 17px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(19, 33, 28, .9); font-size: 20px; font-weight: 600; }
    .footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 28px; border-top: 1px solid rgba(255, 255, 255, .28); color: #dbe6e1; font-size: 20px; }
    .footer strong { color: #c4ef50; font-weight: 800; }
  </style>
</head>
<body>
  <main class="cover">
    <div class="dashboard" aria-hidden="true">
      <div class="dash-head"><span class="dash-title"></span><span class="dash-filter"></span></div>
      <div class="metrics"><span class="metric"></span><span class="metric"></span><span class="metric"></span></div>
      <div class="chart"></div>
      <div class="dashboard-label">从原始表格到 <strong>清晰看板</strong></div>
    </div>
    <div class="inner">
      <div class="brand"><span class="mark">F</span><span>Felix Data Studio</span></div>
      <div class="label">数据分析服务</div>
      <h1>数据分析与<br />可视化看板</h1>
      <p class="subtitle">指标口径 · 趋势分析 · 筛选与导出</p>
      <div class="features">
        <span>数据清洗</span><span>指标梳理</span><span>图表看板</span><span>导出方案</span>
      </div>
      <div class="footer"><span>仅处理有权使用的脱敏数据</span><strong>不售卖数据</strong></div>
    </div>
  </main>
</body>
</html>
