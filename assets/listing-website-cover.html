<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业网页与活动页开发服务主图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; background: #13211c; }
    .cover { position: relative; width: 1024px; height: 1024px; overflow: hidden; color: #fff; background: #13211c; }
    .cover::before {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 56px 56px;
      content: "";
    }
    .cover::after { position: absolute; top: 0; right: 0; width: 360px; height: 100%; background: #1a2c25; content: ""; }
    .browser {
      position: absolute;
      z-index: 1;
      top: 184px;
      right: 26px;
      width: 376px;
      height: 438px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .42);
      background: #edf7fa;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
      transform: rotate(2deg);
    }
    .browser-bar { display: flex; height: 48px; align-items: center; gap: 8px; padding: 0 16px; background: #13211c; }
    .browser-bar i { display: block; width: 9px; height: 9px; border-radius: 50%; background: #f37a68; }
    .browser-bar i:nth-child(2) { background: #c4ef50; }
    .browser-bar i:nth-child(3) { background: #9fb2aa; }
    .address { width: 192px; height: 18px; margin-left: 10px; border-radius: 3px; background: rgba(255, 255, 255, .24); }
    .site-nav { display: flex; height: 52px; align-items: center; justify-content: space-between; padding: 0 22px; background: #fff; }
    .site-nav::before { width: 102px; height: 16px; background: #13211c; content: ""; }
    .site-nav::after { width: 112px; height: 10px; background: #9fb2aa; content: ""; }
    .web-hero { height: 148px; padding: 27px 24px; background: #c4ef50; }
    .web-hero::before { display: block; width: 225px; height: 28px; background: #13211c; content: ""; }
    .web-hero::after { display: block; width: 178px; height: 13px; margin-top: 19px; background: rgba(19, 33, 28, .56); box-shadow: 0 25px 0 rgba(19, 33, 28, .38); content: ""; }
    .web-content { padding: 20px 22px; }
    .section-title { width: 134px; height: 17px; background: #13211c; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin-top: 17px; }
    .card { height: 93px; padding: 13px; border: 1px solid #d1dcda; background: #fff; }
    .card::before { display: block; width: 32px; height: 32px; border-radius: 4px; background: #f37a68; content: ""; }
    .card::after { display: block; width: 67px; height: 9px; margin-top: 12px; background: #9fb2aa; content: ""; }
    .card:nth-child(2)::before { background: #13211c; }
    .card:nth-child(3)::before { background: #c4ef50; }
    .form-band { display: flex; height: 55px; align-items: center; justify-content: space-between; margin-top: 16px; padding: 0 15px; border: 1px solid #d1dcda; background: #fff; }
    .form-band::before { width: 164px; height: 12px; background: #9fb2aa; content: ""; }
    .form-band::after { width: 70px; height: 28px; background: #13211c; content: ""; }
    .website-label {
      position: absolute;
      z-index: 2;
      right: 4px;
      bottom: 10px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: #13211c;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    .website-label strong { color: #c4ef50; }
    .inner { position: relative; z-index: 2; display: flex; height: 100%; flex-direction: column; padding: 72px; }
    .brand { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: 700; }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 50%; background: #c4ef50; color: #13211c; font-size: 26px; font-weight: 900; }
    .label { width: max-content; margin-top: 92px; padding: 10px 16px; background: #edf7fa; color: #13211c; font-size: 21px; font-weight: 800; }
    h1 { max-width: 620px; margin: 28px 0 20px; font-size: 64px; line-height: 1.09; letter-spacing: 0; }
    .subtitle { max-width: 610px; margin: 0; color: #dbe6e1; font-size: 26px; font-weight: 600; }
    .features { display: flex; max-width: 640px; flex-wrap: wrap; gap: 12px; margin-top: 48px; }
    .features span { padding: 12px 17px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(19, 33, 28, .9); font-size: 20px; font-weight: 600; }
    .footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 28px; border-top: 1px solid rgba(255, 255, 255, .28); color: #dbe6e1; font-size: 20px; }
    .footer strong { color: #c4ef50; font-weight: 800; }
  </style>
</head>
<body>
  <main class="cover">
    <div class="browser" aria-hidden="true">
      <div class="browser-bar"><i></i><i></i><i></i><span class="address"></span></div>
      <div class="site-nav"></div>
      <div class="web-hero"></div>
      <div class="web-content"><div class="section-title"></div><div class="cards"><span class="card"></span><span class="card"></span><span class="card"></span></div><div class="form-band"></div></div>
      <div class="website-label">公开展示页面 <strong>响应式开发</strong></div>
    </div>
    <div class="inner">
      <div class="brand"><span class="mark">F</span><span>Felix Data Studio</span></div>
      <div class="label">公开网页开发</div>
      <h1>企业网页与<br />活动页开发</h1>
      <p class="subtitle">服务介绍 · 作品展示 · 活动报名</p>
      <div class="features">
        <span>页面结构</span><span>响应式界面</span><span>表单方案</span><span>源码部署</span>
      </div>
      <div class="footer"><span>域名、服务器等费用提前说明</span><strong>按页面功能报价</strong></div>
    </div>
  </main>
</body>
</html>
