<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品文案与卖点梳理服务主图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; background: #13211c; }
    .cover {
      position: relative;
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      color: #fff;
      background: #13211c;
    }
    .cover::before {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 56px 56px;
      content: "";
    }
    .cover::after {
      position: absolute;
      top: 0;
      right: 0;
      width: 360px;
      height: 100%;
      background: #1a2c25;
      content: "";
    }
    .copy-board {
      position: absolute;
      z-index: 1;
      top: 190px;
      right: 46px;
      width: 320px;
      height: 470px;
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, .35);
      background: #edf7fa;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .34);
      transform: rotate(3deg);
    }
    .board-label { width: 112px; height: 31px; background: #c4ef50; }
    .headline { width: 218px; height: 24px; margin-top: 34px; background: #13211c; }
    .headline.short { width: 152px; margin-top: 14px; }
    .copy-line { width: 238px; height: 12px; margin-top: 32px; background: #9fb2aa; }
    .copy-line + .copy-line { width: 206px; margin-top: 13px; }
    .copy-line.last { width: 164px; }
    .selling-points { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 38px; }
    .selling-points span { display: block; height: 68px; border: 1px solid #9fb2aa; background: #fff; }
    .selling-points span:first-child { border-color: #f37a68; background: #f37a68; }
    .note {
      position: absolute;
      z-index: 2;
      right: 4px;
      bottom: 8px;
      width: 252px;
      padding: 15px 16px;
      background: #13211c;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      transform: rotate(-2deg);
    }
    .note strong { color: #c4ef50; }
    .inner { position: relative; z-index: 2; display: flex; height: 100%; flex-direction: column; padding: 72px; }
    .brand { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: 700; }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 50%; background: #c4ef50; color: #13211c; font-size: 26px; font-weight: 900; }
    .label { width: max-content; margin-top: 92px; padding: 10px 16px; background: #edf7fa; color: #13211c; font-size: 21px; font-weight: 800; }
    h1 { max-width: 610px; margin: 28px 0 20px; font-size: 66px; line-height: 1.09; letter-spacing: 0; }
    .subtitle { max-width: 600px; margin: 0; color: #dbe6e1; font-size: 27px; font-weight: 600; }
    .features { display: flex; max-width: 640px; flex-wrap: wrap; gap: 12px; margin-top: 48px; }
    .features span { padding: 12px 17px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(19, 33, 28, .9); font-size: 20px; font-weight: 600; }
    .footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 28px; border-top: 1px solid rgba(255, 255, 255, .28); color: #dbe6e1; font-size: 21px; }
    .footer strong { color: #c4ef50; font-weight: 800; }
  </style>
</head>
<body>
  <main class="cover">
    <div class="copy-board" aria-hidden="true">
      <div class="board-label"></div>
      <div class="headline"></div>
      <div class="headline short"></div>
      <div class="copy-line"></div>
      <div class="copy-line"></div>
      <div class="copy-line last"></div>
      <div class="selling-points"><span></span><span></span><span></span><span></span></div>
      <div class="note">标题 → 卖点 → <strong>详情结构</strong></div>
    </div>
    <div class="inner">
      <div class="brand"><span class="mark">F</span><span>Felix Data Studio</span></div>
      <div class="label">电商内容服务</div>
      <h1>商品文案与<br />卖点梳理</h1>
      <p class="subtitle">标题短文案 · 核心卖点 · 详情页结构</p>
      <div class="features">
        <span>受众梳理</span><span>卖点提炼</span><span>标题优化</span><span>内容大纲</span>
      </div>
      <div class="footer"><span>基于真实、准确的产品资料整理</span><strong>不虚构宣传</strong></div>
    </div>
  </main>
</body>
</html>
