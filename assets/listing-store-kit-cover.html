<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店铺视觉套装服务主图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; background: #13211c; }
    .cover { position: relative; width: 1024px; height: 1024px; overflow: hidden; color: #fff; background: #13211c; }
    .cover::before {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 56px 56px;
      content: "";
    }
    .cover::after { position: absolute; top: 0; right: 0; width: 360px; height: 100%; background: #1a2c25; content: ""; }
    .shop-kit { position: absolute; z-index: 1; top: 184px; right: 34px; width: 344px; height: 490px; }
    .shop-window {
      position: absolute;
      top: 18px;
      right: 0;
      width: 326px;
      height: 384px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .35);
      background: #edf7fa;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .34);
      transform: rotate(2deg);
    }
    .shop-header { height: 86px; padding: 20px 22px; background: #c4ef50; }
    .shop-brand { display: flex; align-items: center; gap: 14px; }
    .avatar { display: grid; width: 46px; height: 46px; place-items: center; border-radius: 50%; background: #13211c; color: #c4ef50; font-size: 22px; font-weight: 900; }
    .brand-lines span { display: block; width: 116px; height: 13px; background: #13211c; }
    .brand-lines span + span { width: 76px; height: 9px; margin-top: 8px; background: rgba(19, 33, 28, .56); }
    .banner { height: 72px; margin: 20px 22px 0; background: #13211c; }
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 22px 0; }
    .product { height: 112px; border: 1px solid #9fb2aa; background: #fff; }
    .product::before { display: block; width: 100%; height: 66px; background: #dbe6e1; content: ""; }
    .product:first-child::before { background: #f37a68; }
    .product:last-child::before { background: #c4ef50; }
    .kit-label {
      position: absolute;
      z-index: 2;
      right: 10px;
      bottom: 22px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: #13211c;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    .kit-label strong { color: #c4ef50; }
    .inner { position: relative; z-index: 2; display: flex; height: 100%; flex-direction: column; padding: 72px; }
    .brand { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: 700; }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 50%; background: #c4ef50; color: #13211c; font-size: 26px; font-weight: 900; }
    .label { width: max-content; margin-top: 92px; padding: 10px 16px; background: #edf7fa; color: #13211c; font-size: 21px; font-weight: 800; }
    h1 { max-width: 610px; margin: 28px 0 20px; font-size: 70px; line-height: 1.08; letter-spacing: 0; }
    .subtitle { max-width: 610px; margin: 0; color: #dbe6e1; font-size: 26px; font-weight: 600; }
    .features { display: flex; max-width: 640px; flex-wrap: wrap; gap: 12px; margin-top: 48px; }
    .features span { padding: 12px 17px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(19, 33, 28, .9); font-size: 20px; font-weight: 600; }
    .footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 28px; border-top: 1px solid rgba(255, 255, 255, .28); color: #dbe6e1; font-size: 21px; }
    .footer strong { color: #c4ef50; font-weight: 800; }
  </style>
</head>
<body>
  <main class="cover">
    <div class="shop-kit" aria-hidden="true">
      <div class="shop-window">
        <div class="shop-header"><div class="shop-brand"><span class="avatar">F</span><span class="brand-lines"><span></span><span></span></span></div></div>
        <div class="banner"></div>
        <div class="products"><span class="product"></span><span class="product"></span><span class="product"></span></div>
      </div>
      <div class="kit-label">从店招到详情图 <strong>统一风格</strong></div>
    </div>
    <div class="inner">
      <div class="brand"><span class="mark">F</span><span>Felix Data Studio</span></div>
      <div class="label">店铺整套设计</div>
      <h1>店铺视觉<br />套装设计</h1>
      <p class="subtitle">头像 · 店招 · 主图 · 详情图 · 活动海报</p>
      <div class="features">
        <span>统一风格</span><span>上新套图</span><span>多尺寸导出</span><span>源文件可选</span>
      </div>
      <div class="footer"><span>根据图片数量、尺寸与设计复杂度报价</span><strong>按需组合</strong></div>
    </div>
  </main>
</body>
</html>
